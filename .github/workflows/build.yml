name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Criar o projeto Android
        run: |
          mkdir -p app/src/main/java/com/lieber/chat
          cp google-services.json app/google-services.json

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases" }
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "lieberchat"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.lieber.chat'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.lieber.chat'
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '4.0'
                  ndk { abiFilters 'arm64-v8a' }
              }
              packaging {
                  jniLibs {
                      pickFirsts += ['**/libc++_shared.so', '**/libfbjni.so']
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation('org.jitsi.react:jitsi-meet-sdk:+') { transitive = true }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" tools:node="remove" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  @@ICON@@
                  android:label="lieberchat"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NotificacaoService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="chat_listener" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          ICON=""
          IMG=$(ls *.png *.jpg *.jpeg 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick
            for par in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${par%%:*}; s=${par##*:}
              mkdir -p app/src/main/res/mipmap-$d
              convert "$IMG" -resize ${s}x${s}^ -gravity center -extent ${s}x${s} app/src/main/res/mipmap-$d/ic_launcher.png
            done
            ICON='android:icon="@mipmap/ic_launcher"'
            echo "Icone gerado a partir de $IMG"
          fi
          sed -i "s|@@ICON@@|$ICON|" app/src/main/AndroidManifest.xml

          cat > app/src/main/java/com/lieber/chat/BootReceiver.java <<'EOF'
          package com.lieber.chat;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  if (c.getSharedPreferences("lieber", Context.MODE_PRIVATE).getString("email", null) != null) {
                      c.startForegroundService(new Intent(c, NotificacaoService.class));
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/lieber/chat/MainActivity.java <<'EOF'
          package com.lieber.chat;

          import android.Manifest;
          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.jitsi.meet.sdk.JitsiMeetActivity;
          import org.jitsi.meet.sdk.JitsiMeetConferenceOptions;
          import org.jitsi.meet.sdk.JitsiMeetUserInfo;

          import java.net.URL;

          public class MainActivity extends Activity {
              static volatile boolean emPrimeiroPlano = false;
              private static final int PICK = 1;
              private static final String JS =
                      "(function(){if(window.__ln)return;window.__ln=1;"
                      + "var b=document.getElementById('btnAuth'),s=document.getElementById('sair');"
                      + "if(b)b.addEventListener('click',function(){"
                      + "var n=document.getElementById('nick').value.trim().toLowerCase(),p=document.getElementById('senha').value;"
                      + "if(n&&p)LieberNativo.salvarLogin(n+'@lieber-chat.app',p);},true);"
                      + "if(s)s.addEventListener('click',function(){LieberNativo.sair();},true);})();";

              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;

              class Ponte {
                  @JavascriptInterface
                  public void salvarLogin(String email, String senha) {
                      getSharedPreferences("lieber", MODE_PRIVATE).edit()
                              .putString("email", email).putString("senha", senha).apply();
                      iniciarServico("RECONECTAR");
                  }

                  @JavascriptInterface
                  public void sair() {
                      getSharedPreferences("lieber", MODE_PRIVATE).edit().clear().apply();
                      stopService(new Intent(MainActivity.this, NotificacaoService.class));
                  }
              }

              void abrirChamada(Uri u) {
                  try {
                      String email = getSharedPreferences("lieber", MODE_PRIVATE).getString("email", "");
                      String nick = (email != null && email.contains("@")) ? email.substring(0, email.indexOf('@')) : "";
                      Bundle info = new Bundle();
                      info.putString("displayName", nick);
                      JitsiMeetConferenceOptions o = new JitsiMeetConferenceOptions.Builder()
                              .setServerURL(new URL("https://" + u.getHost()))
                              .setRoom(u.getLastPathSegment())
                              .setUserInfo(new JitsiMeetUserInfo(info))
                              .setAudioMuted(false)
                              .setVideoMuted(true)
                              .setWelcomePageEnabled(false)
                              .setFeatureFlag("prejoinpage.enabled", false)
                              .setFeatureFlag("call-integration.enabled", false)
                              .setFeatureFlag("calendar.enabled", false)
                              .setFeatureFlag("invite.enabled", false)
                              .setFeatureFlag("live-streaming.enabled", false)
                              .setFeatureFlag("recording.enabled", false)
                              .build();
                      JitsiMeetActivity.launch(this, o);
                  } catch (Exception e) {
                      Log.e("lieberchat", "chamada", e);
                  }
              }

              void iniciarServico(String acao) {
                  Intent i = new Intent(this, NotificacaoService.class);
                  if (acao != null) i.setAction(acao);
                  startForegroundService(i);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  web.addJavascriptInterface(new Ponte(), "LieberNativo");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("lieberchat.github.io".equals(u.getHost())) return false;
                          if ("org.jitsi.meet".equals(u.getScheme())) {
                              abrirChamada(u);
                              return true;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception e) {
                              if ("org.jitsi.meet".equals(u.getScheme())) {
                                  try {
                                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=org.jitsi.meet")));
                                  } catch (Exception e2) {
                                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=org.jitsi.meet")));
                                  }
                              }
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          v.evaluateJavascript(JS, null);
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(p.createIntent(), PICK);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 2);
                  }
                  if (getSharedPreferences("lieber", MODE_PRIVATE).getString("email", null) != null) {
                      iniciarServico(null);
                  }
                  web.loadUrl("https://lieberchat.github.io");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  emPrimeiroPlano = true;
                  getSystemService(NotificationManager.class).cancelAll();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  emPrimeiroPlano = false;
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == PICK && filePathCallback != null) {
                      filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  String js = "(function(){var s=document.getElementById('sala');"
                          + "if(s&&s.classList.contains('ativa')){document.getElementById('voltar').click();return 1;}return 0;})()";
                  web.evaluateJavascript(js, v -> {
                      if (!"1".equals(v)) moveTaskToBack(true);
                  });
              }
          }
          EOF

          cat > app/src/main/java/com/lieber/chat/NotificacaoService.java <<'EOF'
          package com.lieber.chat;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.Log;

          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.FirebaseAuthInvalidCredentialsException;
          import com.google.firebase.auth.FirebaseAuthInvalidUserException;
          import com.google.firebase.firestore.DocumentChange;
          import com.google.firebase.firestore.DocumentSnapshot;
          import com.google.firebase.firestore.FirebaseFirestore;
          import com.google.firebase.firestore.ListenerRegistration;
          import com.google.firebase.firestore.Query;

          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.Map;
          import java.util.Set;

          public class NotificacaoService extends Service {
              private static final String CANAL_SERVICO = "servico";
              private static final String CANAL_MSG = "mensagens";
              private final Map<String, ListenerRegistration> vigias = new HashMap<>();
              private final Handler handler = new Handler(Looper.getMainLooper());
              private ListenerRegistration listaReg;
              private String meuUid;
              private boolean conectando = false;

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  criarCanais();
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(this, CANAL_SERVICO)
                          .setSmallIcon(android.R.drawable.stat_notify_chat)
                          .setContentTitle("lieberchat conectado")
                          .setContentText("Recebendo suas mensagens")
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(1, n);
                  }
                  if (intent != null && "RECONECTAR".equals(intent.getAction())) {
                      parar();
                      FirebaseAuth.getInstance().signOut();
                  }
                  conectar();
                  return START_STICKY;
              }

              private void criarCanais() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CANAL_SERVICO, "Conex\u00e3o", NotificationManager.IMPORTANCE_LOW));
                  nm.createNotificationChannel(new NotificationChannel(CANAL_MSG, "Mensagens", NotificationManager.IMPORTANCE_HIGH));
              }

              private void parar() {
                  handler.removeCallbacksAndMessages(null);
                  if (listaReg != null) { listaReg.remove(); listaReg = null; }
                  for (ListenerRegistration r : vigias.values()) r.remove();
                  vigias.clear();
                  meuUid = null;
                  conectando = false;
              }

              private void conectar() {
                  if (meuUid != null || conectando) return;
                  final SharedPreferences p = getSharedPreferences("lieber", MODE_PRIVATE);
                  String email = p.getString("email", null);
                  String senha = p.getString("senha", null);
                  if (email == null || senha == null) { stopSelf(); return; }
                  FirebaseAuth auth = FirebaseAuth.getInstance();
                  if (auth.getCurrentUser() != null) {
                      meuUid = auth.getCurrentUser().getUid();
                      ouvirConversas();
                      return;
                  }
                  conectando = true;
                  auth.signInWithEmailAndPassword(email, senha)
                          .addOnSuccessListener(r -> {
                              conectando = false;
                              meuUid = r.getUser().getUid();
                              ouvirConversas();
                          })
                          .addOnFailureListener(e -> {
                              conectando = false;
                              Log.e("lieberchat", "login falhou", e);
                              if (e instanceof FirebaseAuthInvalidCredentialsException
                                      || e instanceof FirebaseAuthInvalidUserException) {
                                  p.edit().clear().apply();
                                  stopSelf();
                              } else {
                                  handler.postDelayed(this::conectar, 30000);
                              }
                          });
              }

              private void ouvirConversas() {
                  final FirebaseFirestore db = FirebaseFirestore.getInstance();
                  listaReg = db.collection("chats").whereArrayContains("members", meuUid)
                          .addSnapshotListener((snap, e) -> {
                              if (snap == null) {
                                  Log.e("lieberchat", "lista de conversas", e);
                                  return;
                              }
                              Set<String> ids = new HashSet<>();
                              for (DocumentSnapshot d : snap.getDocuments()) {
                                  ids.add(d.getId());
                                  if (!vigias.containsKey(d.getId())) vigiar(db, d.getId());
                              }
                              Iterator<Map.Entry<String, ListenerRegistration>> it = vigias.entrySet().iterator();
                              while (it.hasNext()) {
                                  Map.Entry<String, ListenerRegistration> en = it.next();
                                  if (!ids.contains(en.getKey())) {
                                      en.getValue().remove();
                                      it.remove();
                                  }
                              }
                          });
              }

              private void vigiar(FirebaseFirestore db, String chatId) {
                  final boolean[] primeira = {true};
                  ListenerRegistration r = db.collection("chats").document(chatId).collection("messages")
                          .orderBy("createdAt", Query.Direction.DESCENDING).limit(1)
                          .addSnapshotListener((snap, e) -> {
                              if (snap == null) {
                                  Log.e("lieberchat", "mensagens", e);
                                  return;
                              }
                              if (primeira[0]) { primeira[0] = false; return; }
                              for (DocumentChange c : snap.getDocumentChanges()) {
                                  if (c.getType() != DocumentChange.Type.ADDED) continue;
                                  DocumentSnapshot d = c.getDocument();
                                  if (d.getMetadata().hasPendingWrites()) continue;
                                  if (meuUid != null && meuUid.equals(d.getString("uid"))) continue;
                                  if (MainActivity.emPrimeiroPlano) continue;
                                  avisar(chatId, d.getString("name"), resumo(d));
                              }
                          });
                  vigias.put(chatId, r);
              }

              private String resumo(DocumentSnapshot d) {
                  String t = d.getString("text");
                  if (t != null && t.contains("meet.ffmuc.net/")) return "Chamando voc\u00ea para uma chamada";
                  if (t != null && !t.isEmpty()) return t;
                  if (d.getString("img") != null) return "Enviou uma foto";
                  if (d.getString("video") != null) return "Enviou um v\u00eddeo";
                  return "Nova mensagem";
              }

              private void avisar(String chatId, String nome, String texto) {
                  Intent abrir = new Intent(this, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, chatId.hashCode(), abrir,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, CANAL_MSG)
                          .setSmallIcon(android.R.drawable.stat_notify_chat)
                          .setContentTitle(nome == null ? "lieberchat" : nome)
                          .setContentText(texto)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .build();
                  getSystemService(NotificationManager.class).notify(chatId.hashCode(), n);
              }

              @Override
              public void onDestroy() {
                  parar();
                  super.onDestroy();
              }
          }
          EOF

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: lieberchat v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
